opd_mm_common_config: &opd_mm_common_config
  type: native
  vector_device: cuda:0
  raw_inspector_backend: teacher
  raw_inspector_max_tokens: 256
  raw_inspector_temperature: 0.0
  semantic_evidence_selection: true
  evidence_selector_backend: teacher
  evidence_selector_timeout: 120
  evidence_selector_max_tokens: 512
  evidence_selector_retries: 2
  max_actions: 10
  max_pool_size: 24

tools:
  - class_name: "verl.experimental.opd_mm.tools.OPDSearchMetadataTool"
    config: *opd_mm_common_config
  - class_name: "verl.experimental.opd_mm.tools.OPDRetrieveTool"
    config: *opd_mm_common_config
  - class_name: "verl.experimental.opd_mm.tools.OPDExpandNeighborsTool"
    config: *opd_mm_common_config
  - class_name: "verl.experimental.opd_mm.tools.OPDInspectEvidenceImageTool"
    config: *opd_mm_common_config
  - class_name: "verl.experimental.opd_mm.tools.OPDStopTool"
    config: *opd_mm_common_config
